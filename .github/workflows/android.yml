name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: public/models
          key: tilawa-assets-${{ hashFiles('scripts/fetch-assets.sh') }}

      - run: npm ci
      - run: npm run assets
      - run: npm run android:sync

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tilawat.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tilawat.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set; signing with a throwaway debug key, so this APK can't update an existing install."
          fi

      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/tilawat-0.1.${VERSION_CODE}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tilawat-apk
          path: out/*.apk

      # Every main build becomes the latest release, which Obtainium watches for updates.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${VERSION_CODE}" out/*.apk \
            --target "$GITHUB_SHA" --title "Tilawat 0.1.${VERSION_CODE}" --generate-notes --latest
